<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Office 2024</title>
<style>
  :root{
    --bg:#06080c; --panel:#0c1016; --line:#1b222d;
    --text:#e8edf5; --muted:#7d8898; --a:#5eead4; --b:#818cf8;
    --grad:linear-gradient(120deg,var(--a),var(--b));
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  html{color-scheme:dark}
  body{
    height:100dvh;background:var(--bg);color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:grid;grid-template-rows:auto 1fr auto;justify-items:center;
    padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
    background-image:
      radial-gradient(700px 380px at 50% 38%,rgba(129,140,248,.16),transparent 70%),
      radial-gradient(500px 300px at 20% 90%,rgba(94,234,212,.09),transparent 70%),
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:auto,auto,48px 48px,48px 48px;
    background-position:center;
  }
  body::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 35%,var(--bg) 100%)}
  body>*{position:relative;z-index:1}

  .brand{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.4em;text-transform:uppercase;
    color:var(--muted);padding-left:.4em}
  .brand b{color:var(--text);font-weight:600}

  main{align-self:center;display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;max-width:520px}

  .orb{position:relative;width:96px;height:96px;display:grid;place-items:center;margin-bottom:34px}
  .orb::before,.orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(94,234,212,.28)}
  .orb::after{inset:-14px;border-color:rgba(129,140,248,.22);border-style:dashed;animation:spin 24s linear infinite}
  .orb::before{animation:breathe 3.2s ease-in-out infinite}
  .orb i{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;
    background:linear-gradient(160deg,rgba(94,234,212,.16),rgba(129,140,248,.16));
    border:1px solid rgba(255,255,255,.1);box-shadow:0 0 40px rgba(94,234,212,.22)}
  .orb svg{width:26px;height:26px;stroke:var(--text);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes breathe{50%{transform:scale(1.07);opacity:.5}}

  h1{font-size:clamp(46px,12vw,92px);font-weight:700;letter-spacing:-.045em;line-height:1}
  h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .apps{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:20px;
    font-size:clamp(14px,3.6vw,17px);font-weight:500;letter-spacing:.02em;color:var(--text)}
  .apps i{width:4px;height:4px;border-radius:50%;background:var(--a);box-shadow:0 0 8px var(--a)}
  .meta{display:flex;gap:10px;margin:20px 0 38px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
  .meta span{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(12,16,22,.7)}

  .dl{
    position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:12px;
    width:min(100%,320px);height:62px;border-radius:18px;border:0;cursor:pointer;text-decoration:none;
    font:600 16px inherit;font-family:inherit;color:#06080c;background:var(--grad);
    box-shadow:0 12px 50px -10px rgba(94,234,212,.45);transition:transform .2s,box-shadow .2s,filter .2s}
  .dl:hover{filter:brightness(1.08);box-shadow:0 16px 60px -8px rgba(94,234,212,.6)}
  .dl:active{transform:scale(.97)}
  .dl svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .dl .bar{position:absolute;left:0;bottom:0;height:4px;width:0;background:#06080c;opacity:.45}
  .dl.busy .bar{animation:fill .9s linear forwards}
  @keyframes fill{to{width:100%}}
  .dl.done{background:#12201d;color:var(--a);box-shadow:inset 0 0 0 1px var(--a),0 0 40px rgba(94,234,212,.15)}

  footer{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:#4a5465;text-transform:uppercase}

  @media(max-height:560px){
    .orb{display:none}
    .meta{margin:16px 0 24px}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="brand"><b>Nuru</b></div>

  <main>
    <div class="orb"><i><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg></i></div>
    <h1><span id="title">Office 2024</span></h1>
    <div class="apps"><span>Word</span><i></i><span>Excel</span><i></i><span>PowerPoint</span></div>
    <div class="meta"><span id="type">ZIP</span><span id="size">3.09 MB</span></div>
    <a class="dl" id="dl" href="files/Office 2024.zip" download="Office 2024.zip">
      <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>
      <span id="label">Download</span><i class="bar"></i>
    </a>
  </main>

  <footer id="fname">Office 2024.zip</footer>

<script>
  /* Edit the file link above in the <a id="dl"> tag (href + download),
     and the title / size text in the HTML. Keep the file inside the "files" folder. */
  const dl = document.getElementById("dl"), label = document.getElementById("label");
  dl.addEventListener("click", () => {
    if (dl.classList.contains("busy")) return;
    dl.classList.add("busy");
    setTimeout(() => {
      dl.classList.remove("busy"); dl.classList.add("done"); label.textContent = "Downloaded";
      setTimeout(() => { dl.classList.remove("done"); label.textContent = "Download"; }, 2200);
    }, 900);
  });
</script>
</body>
</html>
